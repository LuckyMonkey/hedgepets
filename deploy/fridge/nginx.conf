# HedgePets web build under /hedgepets/ (Caddy keeps the prefix). Godot's web files: index.html, .js, .wasm, .pck.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # the standard list (html, js, wasm, png); anything else (.pck) is plain binary. A bare types {} block would
    # replace the whole list and send index.html as a download.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # redirects stay relative: nginx sits behind Caddy on :8080 and must not put that port in a Location
    absolute_redirect off;
    gzip on;
    gzip_types application/wasm application/octet-stream application/javascript text/css;
    gzip_min_length 1024;

    location = /hedgepets { return 302 /hedgepets/; }
    location /hedgepets/ {
        alias /usr/share/nginx/html/;
        index index.html;
        # file names don't change between builds: always revalidate (ETag) so an update is picked up
        add_header Cache-Control "no-cache";
    }
}
